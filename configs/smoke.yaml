# Tiny preset: correctness checks on CPU in a few minutes.
data:
  seed: 1337
  preset: smoke
  days: 6
  n_hosts: 60
  n_users: 50
  n_incidents: 14
  attack_events_range: [18, 40]
  regenerate: false

graph:
  leakage_auc_threshold: 0.95
  # shorter timeline -> wider fractions and smaller gap than the full preset
  split_train_frac: 0.55
  split_val_frac: 0.20
  split_gap_hours: 2.0

model:
  model: rgat
  hidden_dim: 48
  num_layers: 3
  num_heads: 4
  feat_drop: 0.1
  attn_drop: 0.1

sampling:
  fanouts:
    PROCESS_CHILD: [4, 2]
    SESSION_ACTION: [4, 2]
    HOST_SEQUENCE: [3, 2]
    USER_SEQUENCE: [3, 2]
    NET_TRIGGER: [4, 2]
    CONFIG_TRIGGER: [3, 2]
  batch_seeds: 256
  pos_seed_frac: 0.5
  eval_batch_seeds: 1024
  eval_fanout_mult: 2
  min_steps_per_epoch: 20
  num_workers: 0

train:
  epochs: 15
  lr: 0.002
  warmup_steps: 30
  focal_gamma: 2.0
  focal_alpha: 0.8
  patience: 6
  log_every: 3
  amp: false
  device: auto
  run_mlp_baseline: true
